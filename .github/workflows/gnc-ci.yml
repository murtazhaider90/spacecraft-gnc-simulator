name: GNC simulator CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test with coverage
        run: |
          coverage run --source=src/gnc -m pytest -q
          coverage report --fail-under=95
      - name: Nominal regression
        run: python examples/run_nominal.py
